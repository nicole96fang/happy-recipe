<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#4ba7ca" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="幸福食谱" />
<title>幸福食谱 · Happy Recipe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🍯%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🍯%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=LXGW+WenKai:wght@300;400;700&family=Long+Cang&family=Caveat:wght@500;700&family=Pacifico&display=swap">
<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>

<!-- ❄️ 雪花动画层 -->
<div class="snow-layer" aria-hidden="true"></div>

<!-- 🫧 飘落气泡层 -->
<div class="bubble-layer" aria-hidden="true"></div>

<!-- 💧 水彩背景 -->
<div class="watercolor-bg" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
  <span class="blob blob-4"></span>
</div>

<!-- 主应用容器 -->
<main id="app" class="app-root"></main>

<!-- 全局底部 toast -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 隐藏的文件上传 -->
<input id="file-input" type="file" accept="image/*" multiple hidden />
<input id="restore-input" type="file" accept="application/json,.json" hidden />

<!-- 模块化脚本 -->
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/seed.js"></script>
<script src="js/views.js"></script>
<script src="js/router.js"></script>
<script src="js/print.js"></script>
<script src="js/share.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>
</body>
</html>
